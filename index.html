:root{--bg:#eef1f8;--g1:rgba(90,140,220,.30);--g2:rgba(160,120,220,.24);--g3:rgba(90,190,210,.24);--g4:rgba(230,130,180,.20);--glass:rgba(255,255,255,.62);--glass2:rgba(255,255,255,.88);--bd:rgba(20,30,60,.09);--tx:#1b2233;--mut:#667089;--ac:#3a82d0;--ok:#4aa77f;--warn:#d4903f;--bad:#cf5c63;--sh:0 8px 28px rgba(40,60,110,.10);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

.lg{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px}

.lgi i{width:9px;height:9px;border-radius:50%;flex:none}
.lgi span{color:var(--tx);font-size:13px}
.lgi b{font-weight:600;color:var(--mut)}
.lgi:focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:6px}

.rh .sub{flex:none}
.mh h2{overflow-wrap:anywhere}
.al div{gap:10px}
.al div span{min-width:0;overflow-wrap:anywhere}
.al div .btn{flex:none}
.lgi span{overflow-wrap:anywhere;text-align:left}
@media (max-width:520px){.sh{flex-direction:column;align-items:stretch}.sm2{text-align:left}}
/* ===== แถบบนติดหน้าจอ (ไม่เลื่อนตาม) ===== */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;margin:-18px -16px 16px;padding:14px 16px 12px;background:rgba(238,241,248,.78);background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(22px) saturate(1.3);-webkit-backdrop-filter:blur(22px) saturate(1.3);border-bottom:1px solid var(--bd)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:rgba(238,241,248,.78);background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(22px) saturate(1.3);-webkit-backdrop-filter:blur(22px) saturate(1.3)}
/* ===== Login ===== */
#login{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;padding:20px;background:radial-gradient(40% 35% at 15% 10%,var(--g1),transparent 70%),radial-gradient(35% 35% at 85% 15%,var(--g2),transparent 70%),radial-gradient(40% 40% at 70% 90%,var(--g3),transparent 70%),radial-gradient(35% 35% at 10% 85%,var(--g4),transparent 70%),var(--bg)}

.lg{width:100%;max-width:360px;border-radius:24px;padding:26px 22px;display:grid;gap:12px}

</style>

<body>
<div class="wrap">

<script>
/* ===== JS: แก้การทำงานหน้าเว็บที่นี่ ===== */
(function(){
window.__ok=1;
const D=864e5,$=id=>document.getElementById(id);
let S={items:[],modal:null,img:null,del:false,arch:false,open:{},pop:null,filt:null};
(function(){const m=matchMedia('(prefers-color-scheme: dark)');const f=()=>document.documentElement.dataset.theme=m.matches?'dark':'light';f();m.addEventListener&&m.addEventListener('change',f)})();
function seedList(){const n=Date.now(),out=[];
[['สบู่ก้อน','🧼','ห้องน้ำ','ก้อน',1,.6,25,6,20],['ยาสีฟัน','🪥','ห้องน้ำ','หลอด',1,.25,55,3,40],['แชมพู','🧴','ห้องน้ำ','ขวด',1,.5,89,2,30],['ทิชชู่','🧻','ห้องน้ำ','ม้วน',3,6,9,24,18],
['นมกล่อง','🥛','อาหาร','กล่อง',5,10,12,24,5],['ข้าวสาร','🍚','อาหาร','กก.',4,3.5,45,10,10],['ไข่ไก่','🥚','อาหาร','ฟอง',20,14,5,30,6],['น้ำมันพืช','🫒','อาหาร','ขวด',1,.3,65,2,15],
['น้ำยาล้างจาน','🍽️','ซักล้าง','ขวด',1,.4,45,3,12],['ผงซักฟอก','🧺','ซักล้าง','ถุง',1,.25,120,2,25]]
.forEach((r,k)=>out.push({id:'s'+k,name:r[0],emoji:r[1],cat:r[2],unit:r[3],stock:r[4],full:Math.max(r[4],r[7]),wk:r[5],price:r[6],buy:r[7],last:n-r[8]*D,log:[{k:'b',t:n-r[8]*D,q:r[7],p:r[6]}]}));return out}
let pend=0;
/* ===== เชื่อมต่อ Apps Script + ระบบ login ===== */
const API_URL='https://script.google.com/macros/s/AKfycbycbOTDh8xgy9rLnQ9CMvWfLfT40dOoztinej5osOAAT9ipvpSP2S0_ofeW-6fchgozTw/exec'; // วาง URL ของ Web app (ลงท้าย /exec) ตรงนี้
const TK='hi_token',CK='hi_cache';
const ls={get:k=>{try{return localStorage.getItem(k)||''}catch(e){return ''}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
const tok=()=>ls.get(TK);
async function call(body){
  let r;
  try{r=await fetch(API_URL,{method:'POST',body:JSON.stringify(body)})}
  catch(e){throw new Error('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ (อาจออฟไลน์)')}
  try{return await r.json()}catch(e){throw new Error('เซิร์ฟเวอร์ตอบกลับผิดรูปแบบ (ตรวจ URL และการ Deploy)')}
}

  const el=$('login');if(!el)return;
  el.classList.add('on');$('lg-e').textContent=msg||'';$('lg-p').value='';
  setTimeout(()=>{try{($('lg-u').value?$('lg-p'):$('lg-u')).focus()}catch(e){}},50);

const run=async(fn,...a)=>{
  const j=await call({fn:fn,args:a,token:tok()});
  if(j&&j.err==='AUTH'){ls.del(TK);ls.del(CK);S.items=[];S.sig='';showLogin('เซสชันหมดอายุ กรุณาเข้าสู่ระบบใหม่');throw new Error('AUTH')}

};
const stat=t=>{const e=$('stat');if(e)e.textContent=t};
function sync(p){pend++;stat('กำลังบันทึก…');p.then(l=>{if(--pend===0){S.items=l;S.sig=JSON.stringify(l);stat('');if(!S.modal||S.modal.mode==='view')render()}}).catch(e=>{pend--;stat(e&&e.message==='AUTH'?'':'บันทึกไม่สำเร็จ: '+(e&&e.message||e))})}

const todayStr=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
function wkSync(){const w=$('f-wku');if(!w)return;const un=($('f-unit').value||'').trim()||'หน่วย',su=($('f-su').value||'').trim(),sz=+$('f-size').value||0,ok=sz>0&&su;let cur=w.value==='s'&&ok?'s':'u';
 w.innerHTML='<option value="u">'+esc(un)+'</option>'+(ok?'<option value="s">'+esc(su)+'</option>':'');w.value=cur;w.style.display=ok?'':'none';
 const v=+$('f-wk').value,h=$('wkh');if(h)h.textContent=v>0&&ok?(cur==='s'?'= '+(+(v/sz).toFixed(3))+' '+un+'/สัปดาห์':'= '+(+(v*sz).toFixed(2))+' '+su+'/สัปดาห์'):''}
function wkU(){const v=Math.max(0,+$('f-wk').value||0),sz=Math.max(0,+$('f-size').value||0),w=$('f-wku');return w&&w.value==='s'&&sz>0?+(v/sz).toFixed(5):v}
const dayT=s=>new Date(s+'T12:00:00').getTime();
function histRows(p0){const o=[];for(let k=0;k<3;k++){const d=$('h-d'+k),q=$('h-q'+k),pr=$('h-p'+k);if(d&&q&&d.value&&+q.value>0){const qq=+q.value,tot=pr&&+pr.value>0?+pr.value:qq*p0;o.push({k:'b',t:dayT(d.value),q:qq,p:tot/qq})}}return o.sort((a,b)=>a.t-b.t)}
function buy(i,q,tot,t,n,add){const p=q?tot/q:0;if(add){i.stock=+(i.stock+q).toFixed(2);i.full=Math.max(i.stock,q)}if(t>=(i.last||0)){i.last=t;if(tot>0)i.price=+p.toFixed(4)}i.log.push({k:'b',t,q,p,n:n||undefined})}
document.addEventListener('click',e=>{try{click_(e)}catch(err){stat('! '+err.message)}});
function click_(e){const a=e.target.closest('[data-act]');if(!a)return;const t=a.dataset.act,i=get(a.dataset.id);
 if((t==='bg'||t==='popbg')&&e.target!==a)return;
 if(t==='open'){S.modal={id:i.id,mode:'view'};S.open={};S.pop=null}
 else if(t==='pop')S.pop=a.dataset.k;
 else if(t==='popclose'||t==='popbg')S.pop=null;
 else if(t==='sec')S.open[a.dataset.k]=!S.open[a.dataset.k];
 else if(t==='filt')S.filt=a.dataset.c||null;
 else if(t==='close'||t==='bg'){S.pop=null;S.modal=null;S.del=false;S.img=null}
 else if(t==='new'){S.modal={mode:'new'};S.img=null}
 else if(t==='edit'){S.modal={id:i.id,mode:'edit'};S.img=i.img||null}
 else if(t==='cancel'){S.del=false;S.modal=i?{id:i.id,mode:'view'}:null}
 else if(t==='use'){const q0=+$('qu').value,sz=$('su')?+$('su').value||i.size:0,q=i.size>0&&sz>0?+(q0*sz/i.size).toFixed(4):q0;const dv=$('du').value,add=$('sku').checked,tt=!dv||dv===todayStr()?Date.now():Math.min(dayT(dv),Date.now());if(q>0){if(add)i.stock=Math.max(0,+(i.stock-q).toFixed(2));i.log.push({k:'u',t:tt,q});S.pop=null;sync(run('act',i.id,'u',q,0,tt,'',add))}}
 else if(t==='buy'){const qp=+$('qb').value,tot=Math.max(0,+$('pb').value||0),dv=$('db').value,add=$('sb').checked,sz=$('sz')?+$('sz').value||i.size:0;let n=$('nb').value.trim();if(!(qp>0)){$('qb').focus();return}const eq=i.size>0&&sz>0?+(qp*sz/i.size).toFixed(4):qp;if(i.size>0)n=[num2(qp)+' × '+num2(sz)+' '+i.sunit,n].filter(Boolean).join(' · ');const tt=!dv||dv===todayStr()?Date.now():dayT(dv);buy(i,eq,tot,tt,n,add);S.pop=null;sync(run('act',i.id,'b',eq,tot,tt,n,add))}
 else if(t==='quickbuy'){S.modal={id:i.id,mode:'view'};S.open={};S.pop='buy';S.focus='pb'}
 else if(t==='arch'){i.arch=true;S.modal=null;sync(run('arch',i.id,true))}
 else if(t==='restore'){i.arch=false;sync(run('arch',i.id,false))}
 else if(t==='demo'){S.items=seedList();sync(run('seed',S.items))}
 else if(t==='toggleArch')S.arch=!S.arch;
 else if(t==='del'){if(S.del){S.items=S.items.filter(o=>o!==i);S.modal=null;S.del=false;sync(run('remove',i.id))}else S.del=true}
 else if(t==='save'){const v=id=>$(id).value.trim(),n=id=>Math.max(0,+$(id).value||0),name=v('f-name');if(!name){$('f-name').focus();return}
  const d={name,emoji:v('f-emoji')||'📦',cat:v('f-cat')||'อื่น ๆ',unit:v('f-unit')||'ชิ้น',stock:n('f-stock'),price:n('f-price'),wk:wkU(),buy:n('f-buy')||1,size:n('f-size'),sunit:v('f-su'),img:S.img||undefined};
  if(S.modal.mode==='new'){const hr=histRows(d.price);if(!d.price&&hr.length)d.price=+hr[hr.length-1].p.toFixed(4);const o=Object.assign({},d,{id:'i'+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36),full:Math.max(d.stock,d.buy),last:hr.length?hr[hr.length-1].t:0,log:hr});S.items.push(o);S.modal=null;sync(run('upsert',toSrv(o,true)))}
  else{const o=get(S.modal.id);Object.assign(o,d);o.full=Math.max(o.full||0,d.stock);S.modal={id:o.id,mode:'view'};sync(run('upsert',toSrv(o)))}
  S.img=null}
 render()}
const imgMsg=s=>{const p=$('prev');if(p)p.innerHTML='<div class="sub" style="padding:8px;text-align:center;word-break:break-all">'+esc(s)+'</div>'};
async function toBitmap(f){
 if(window.createImageBitmap){try{return await createImageBitmap(f,{imageOrientation:'from-image'})}catch(e){}try{return await createImageBitmap(f)}catch(e){}}
 return await new Promise((ok,no)=>{const u=URL.createObjectURL(f),im=new Image();im.onload=()=>ok(im);im.onerror=()=>no(new Error('เปิดไฟล์รูปไม่ได้ ('+(f.type||'ไม่ทราบชนิด')+')'));im.src=u})}
function restorePrev(){const nm=$('f-name'),pv=$('prev');if(pv)pv.innerHTML=pic({name:(nm&&nm.value)||'x',img:S.img})}
function openCrop(bmp){
 const w=bmp.width,h=bmp.height,FW=Math.min(320,innerWidth-80),FH=Math.round(FW*4/7),s0=Math.max(FW/w,FH/h),zf=Math.min(FW/w,FH/h)/s0,ZMIN=Math.min(.2,zf),ZMAX=5;
 let z=1,cx=FW/2,cy=FH/2,el=$('crop');const ptr=new Map();let pd=0;
 if(!el){el=document.createElement('div');el.id='crop';document.body.appendChild(el)}
 el.innerHTML=`<div class="sheet" style="z-index:30"><div class="panel"><div class="mh"><h2>ครอปรูป</h2></div><div class="sub" style="margin-bottom:8px">ลากเพื่อเลื่อน · ใช้สองนิ้วถ่าง/หนีบ หรือกดปุ่ม − + เพื่อย่อ/ขยาย · กรอบเส้นประคือส่วนที่เห็นในรูปเล็ก</div><div class="cw" style="width:${FW}px;height:${FH}px"><canvas id="cc" width="${FW}" height="${FH}"></canvas><i class="cg" style="width:${FH}px;height:${FH}px"></i></div><div class="zr"><button class="btn" id="zm" aria-label="ย่อ">−</button><button class="btn" id="zfit">ทั้งรูป</button><button class="btn" id="zfill">เต็มกรอบ</button><button class="btn" id="zp" aria-label="ขยาย">+</button></div><div class="foot"><button class="btn" id="cx">ยกเลิก</button><button class="btn pri" id="cok">ใช้รูปนี้</button></div></div></div>`;
 const cv=$('cc'),g=cv.getContext('2d');
 const lim=(c,len,F)=>len>=F?Math.min(len/2,Math.max(F-len/2,c)):Math.min(F-len/2,Math.max(len/2,c));
 const clamp=()=>{const sc=s0*z;cx=lim(cx,w*sc,FW);cy=lim(cy,h*sc,FH)};
 const draw=(ctx,k)=>{const sc=s0*z*k;ctx.fillStyle='#fff';ctx.fillRect(0,0,FW*k,FH*k);ctx.drawImage(bmp,cx*k-w*sc/2,cy*k-h*sc/2,w*sc,h*sc)};
 const paint=()=>{clamp();draw(g,1)};paint();
 const setZ=nz=>{nz=Math.min(ZMAX,Math.max(ZMIN,nz));const r=nz/z;z=nz;cx=FW/2+(cx-FW/2)*r;cy=FH/2+(cy-FH/2)*r;paint()};
 const dist=()=>{const p=[...ptr.values()];return Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y)};
 cv.addEventListener('pointerdown',e=>{ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});try{cv.setPointerCapture(e.pointerId)}catch(x){}if(ptr.size===2)pd=dist()});
 cv.addEventListener('pointermove',e=>{const p=ptr.get(e.pointerId);if(!p)return;
  if(ptr.size===2){p.x=e.clientX;p.y=e.clientY;const d=dist();if(pd>0)setZ(z*d/pd);pd=d}
  else{cx+=e.clientX-p.x;cy+=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;paint()}});
 const up=e=>{ptr.delete(e.pointerId);pd=0;const r=[...ptr.values()];if(r.length===1){/* เหลือนิ้วเดียว ใช้ต่อได้เลย */}};
 cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
 cv.addEventListener('wheel',e=>{e.preventDefault();setZ(z*Math.exp(-e.deltaY*.0015))},{passive:false});
 $('zm').addEventListener('click',()=>setZ(z/1.15));$('zp').addEventListener('click',()=>setZ(z*1.15));
 $('zfit').addEventListener('click',()=>{z=zf;cx=FW/2;cy=FH/2;paint()});
 $('zfill').addEventListener('click',()=>{z=1;cx=FW/2;cy=FH/2;paint()});
 const close=()=>{el.innerHTML='';restorePrev()};
 $('cx').addEventListener('click',close);
 $('cok').addEventListener('click',()=>{const k=560/FW,c=document.createElement('canvas');c.width=560;c.height=Math.round(FH*k);draw(c.getContext('2d'),k);
  let q=.85,d=c.toDataURL('image/jpeg',q);while(d.length>200000&&q>.3){q-=.1;d=c.toDataURL('image/jpeg',q)}
  S.img=d;close()});
}
async function pickImg(inp){
 const f=inp.files&&inp.files[0];if(!f)return;
 imgMsg('กำลังประมวลผลรูป…');
 try{openCrop(await toBitmap(f))}catch(err){imgMsg('ใช้รูปนี้ไม่ได้: '+(err&&err.message||err))}
 try{inp.value=''}catch(e){}
}
document.addEventListener('change',e=>{const t=e.target;if(!t)return;if(t.id==='f-wku')wkSync();if(t.id==='f-img')pickImg(t);else if(t.id==='db'){const c=$('sb');if(c)c.checked=!t.value||t.value===todayStr()}});
document.addEventListener('input',e=>{const id=e.target&&e.target.id;if(id==='f-unit'||id==='f-su'||id==='f-size'||id==='f-wk')wkSync();if(id!=='qb'&&id!=='pb'&&id!=='sz')return;const i=S.modal&&get(S.modal.id),pb=$('pb'),qb=$('qb');if(!i||!pb||!qb)return;const szEl=$('sz'),sz=szEl?+szEl.value:0,f=i.size>0&&sz>0?sz/i.size:1;if((id==='qb'||id==='sz')&&pb.dataset.auto)pb.value=+(qb.value*f*i.price).toFixed(2);if(id==='pb')delete pb.dataset.auto;$('ub').textContent=buyHint(i,qb.value,pb.value,sz)});
document.addEventListener('error',e=>{const t=e.target;if(t&&t.tagName==='IMG'&&t.dataset&&t.dataset.fb!==undefined){const sp=document.createElement('span');if(t.dataset.fb&&t.dataset.fb!=='📦')sp.textContent=t.dataset.fb;else sp.innerHTML=ic('box');t.replaceWith(sp)}},true);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.pop){S.pop=null;render()}else if(e.key==='Escape'&&S.modal){S.modal=null;render()}else if(e.key==='Enter'&&e.target.classList.contains('card'))e.target.click()});
$('lgf').addEventListener('submit',async e=>{
 e.preventDefault();
 const b=$('lg-b'),er=$('lg-e');b.disabled=true;er.textContent='';
 try{
  const j=await call({fn:'login',args:[$('lg-u').value.trim(),$('lg-p').value]});
  if(!j||!j.ok)throw new Error(j&&j.err||'เข้าสู่ระบบไม่สำเร็จ');
  ls.set(TK,j.token);$('lg-p').value='';$('login').classList.remove('on');
  $('app').innerHTML='<div class="empty glass">กำลังโหลด…</div>';S.sig='';refresh();
 }catch(err){er.textContent=err.message||String(err)}
 b.disabled=false;
});
$('lo').addEventListener('click',async()=>{
 if(!confirm('ออกจากระบบ?'))return;
 try{await call({fn:'logout',args:[],token:tok()})}catch(e){}
 ls.del(TK);ls.del(CK);S.items=[];S.sig='';$('app').innerHTML='';showLogin('');
});
if(tok()){
 try{const c=JSON.parse(ls.get(CK)||'null');if(Array.isArray(c)&&c.length){S.items=c;S.sig=JSON.stringify(c);render()}else $('app').innerHTML='<div class="empty glass">กำลังโหลด…</div>'}catch(e){$('app').innerHTML='<div class="empty glass">กำลังโหลด…</div>'}
 refresh();
}else{$('app').innerHTML='';showLogin('')}
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
setInterval(()=>{if(!document.hidden)refresh()},30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
})();
</script>
